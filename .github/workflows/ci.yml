name: LOCKGO CI/CD Platform Pipeline

on:
  push:
    branches: [ main, master, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Typecheck, Automated Tests & Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Static Gate (0 Errors)
        run: bun run typecheck

      - name: Run Automated Test Suites (Unit, Concurrency, IoT, Security, Payment, PII Masking, MCP)
        run: bun test

      - name: Build Docker Container
        run: docker build -t lockgo-platform:latest .
